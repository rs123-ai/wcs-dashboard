<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCS 设备运行监控仪表盘</title>
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1e;color:#c8d6e5;font-family:'Microsoft YaHei','PingFang SC',sans-serif;min-height:100vh}
.header{background:linear-gradient(90deg,#0d1528,#111d3a);border-bottom:2px solid #1a2a4a;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{font-size:22px;font-weight:700;color:#4da8da;letter-spacing:2px}
.logo span{color:#ff6b3d}
.view-toggle{display:flex;background:#111d3a;border-radius:6px;overflow:hidden;border:1px solid #2a3a5a}
.view-btn{padding:6px 16px;font-size:13px;cursor:pointer;border:none;background:transparent;color:#7788aa;transition:all .2s}
.view-btn.active{background:#1a6fb5;color:#fff}
.view-btn:hover:not(.active){color:#c8d6e5}
.select-wrapper select{background:#111d3a;color:#c8d6e5;border:1px solid #2a3a5a;padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer;min-width:220px}
.select-wrapper select:focus{outline:none;border-color:#4da8da}
.btn{padding:7px 16px;border-radius:4px;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:all .2s}
.btn-warning{background:#d35400;color:#fff}
.btn-warning:hover{background:#e67e22}
.btn-outline{background:transparent;color:#4da8da;border:1px solid #2a3a5a}
.btn-outline:hover{border-color:#4da8da;background:#0d1528}

.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:16px 24px}
.stat-card{background:linear-gradient(135deg,#0d1528,#111d3a);border:1px solid #1a2a4a;border-radius:8px;padding:14px;text-align:center}
.stat-value{font-size:28px;font-weight:700;color:#fff}
.stat-value.warn{color:#ff6b3d}
.stat-value.ok{color:#2ecc71}
.stat-value.info{color:#4da8da}
.stat-label{font-size:11px;color:#7788aa;margin-top:4px}

.main-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:0 24px 16px;min-height:70vh}
.panel{background:linear-gradient(135deg,#0d1528,#111d3a);border:1px solid #1a2a4a;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(26,42,74,.5);border-bottom:1px solid #1a2a4a;min-height:40px}
.panel-title{font-size:14px;font-weight:600;color:#4da8da}
.panel-badge{font-size:11px;color:#7788aa}
.panel-body{flex:1;overflow:auto;padding:8px;min-height:200px}
.panel-body.chart-body{display:flex;align-items:center;justify-content:center}

table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:rgba(26,42,74,.8);color:#7788aa;padding:8px 10px;text-align:left;font-weight:500;position:sticky;top:0;z-index:1;border-bottom:1px solid #1a2a4a}
tbody td{padding:7px 10px;border-bottom:1px solid #0d1528;color:#c8d6e5}
tbody tr:hover{background:rgba(26,42,74,.3)}

.badge{padding:2px 8px;border-radius:3px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-danger{background:rgba(192,57,43,.3);color:#e74c3c}
.badge-warn{background:rgba(211,84,0,.3);color:#f39c12}
.badge-info{background:rgba(26,111,181,.3);color:#4da8da}
.badge-ok{background:rgba(39,174,96,.3);color:#2ecc71}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:150px;color:#3a4a6a;gap:12px}
.empty-state-icon{font-size:40px}

.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,15,30,.85);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid #1a2a4a;border-top-color:#4da8da;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#7788aa;font-size:14px}

.toast{position:fixed;bottom:24px;right:24px;background:#111d3a;border:1px solid #2a3a5a;color:#c8d6e5;padding:12px 24px;border-radius:8px;z-index:2000;animation:slideIn .3s;font-size:13px;max-width:500px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.error{border-color:#c0392b;color:#e74c3c}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0d1528}
::-webkit-scrollbar-thumb{background:#1a2a4a;border-radius:3px}

.chart-fallback{color:#7788aa;text-align:center;padding:20px}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">正在加载数据...</div>
</div>

<div class="header">
  <div class="header-left">
    <div class="logo">WCS<span>Monitor</span></div>
    <div class="view-toggle" id="viewToggle">
      <button class="view-btn active" onclick="switchView('daily')">日视图</button>
      <button class="view-btn" onclick="switchView('weekly')">周视图</button>
    </div>
    <div class="select-wrapper">
      <select id="dateSelect" onchange="onDateChange()"></select>
    </div>
    <span style="font-size:11px;color:#7788aa" id="viewHint"></span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-outline" onclick="exportPDF()">导出PDF</button>
  </div>
</div>

<div id="statsBar" class="stats-bar">
  <div class="stat-card"><div class="stat-value" style="color:#4da8aa">--</div><div class="stat-label">正在加载...</div></div>
</div>

<div id="mainGrid" class="main-grid">
  <div class="panel">
    <div class="panel-header"><span class="panel-title">NOREAD 条码识别事件</span><span class="panel-badge" id="noreadBadge"></span></div>
    <div class="panel-body" id="noreadPanel"><div class="empty-state"><div class="empty-state-icon">&#128203;</div><div>加载中...</div></div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><span class="panel-title">设备故障分类</span><span class="panel-badge" id="faultBadge"></span></div>
    <div class="panel-body" id="deviceFaultPanel"><div class="empty-state"><div class="empty-state-icon">&#128295;</div><div>加载中...</div></div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><span class="panel-title">错误分布统计（事件维度）</span></div>
    <div class="panel-body chart-body" id="chartPanel"><canvas id="errorChart"></canvas></div>
  </div>
  <div class="panel">
    <div class="panel-header"><span class="panel-title" id="trendTitle">按小时错误趋势</span></div>
    <div class="panel-body chart-body" id="hourlyPanel"><canvas id="hourlyChart"></canvas></div>
  </div>
</div>

<script>
// ===================== GLOBALS =====================
var DATA = null;
var currentView = 'daily'; // 'daily' | 'weekly'
var currentKey = null;     // date string or week string
var errorChartInst = null;
var hourlyChartInst = null;

// ===================== INIT =====================
function init() {
  console.log('[WCS] Loading data.json...');
  fetch('data.json?' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      DATA = data;
      console.log('[WCS] Loaded:', Object.keys(data.daily).length, 'days,', Object.keys(data.weekly).length, 'weeks');
      switchView('daily');
      document.getElementById('loadingOverlay').classList.add('hidden');
    })
    .catch(function(e) {
      console.error('[WCS] Failed to load data.json:', e);
      document.getElementById('loadingOverlay').classList.add('hidden');
      document.getElementById('statsBar').innerHTML = '<div class="stat-card" style="grid-column:1/-1"><div class="stat-value warn">加载失败</div><div class="stat-label">无法加载 data.json，请检查文件是否存在</div></div>';
    });
}

// ===================== VIEW SWITCH =====================
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelector('.view-btn[onclick*="' + view + '"]').classList.add('active');

  var sel = document.getElementById('dateSelect');
  var hint = document.getElementById('viewHint');

  if (view === 'daily') {
    var dates = Object.keys(DATA.daily).sort();
    sel.innerHTML = dates.map(function(d) {
      var label = formatDate(d) + ' (' + DATA.daily[d].filename + ')';
      return '<option value="' + d + '">' + label + '</option>';
    }).join('');
    if (dates.length > 0) {
      currentKey = dates[dates.length - 1];
      sel.value = currentKey;
    }
    hint.textContent = dates.length + ' 天数据';
    document.getElementById('trendTitle').textContent = '按小时错误趋势';
  } else {
    var weeks = Object.keys(DATA.weekly).sort();
    sel.innerHTML = weeks.map(function(w) {
      var wk = DATA.weekly[w];
      return '<option value="' + w + '">' + w + ' (' + formatDate(wk.startDate) + ' ~ ' + formatDate(wk.endDate) + ', ' + wk.days.length + '天)</option>';
    }).join('');
    if (weeks.length > 0) {
      currentKey = weeks[weeks.length - 1];
      sel.value = currentKey;
    }
    hint.textContent = weeks.length + ' 周数据';
    document.getElementById('trendTitle').textContent = '按天错误趋势';
  }

  renderAll();
}

function onDateChange() {
  currentKey = document.getElementById('dateSelect').value;
  renderAll();
}

// ===================== DATA ACCESS =====================
function getCurrentData() {
  if (!DATA) return null;
  if (currentView === 'daily') return DATA.daily[currentKey];
  return DATA.weekly[currentKey];
}

// ===================== RENDER =====================
function renderAll() {
  var data = getCurrentData();
  if (!data) return;

  renderStats(data);
  renderNOREADPanel(data);
  renderDeviceFaultPanel(data);

  setTimeout(function() {
    renderErrorChart(data);
    if (currentView === 'daily') {
      renderHourlyChart(data);
    } else {
      renderWeeklyBarChart(data);
    }
  }, 100);
}

function renderStats(data) {
  var s = data.stats;
  var timeLabel = currentView === 'daily'
    ? (s.timeSpan ? s.timeSpan.start + ' ~ ' + s.timeSpan.end : '--')
    : (data.startDate ? formatDateShort(data.startDate) + ' ~ ' + formatDateShort(data.endDate) : '--');

  document.getElementById('statsBar').innerHTML =
    '<div class="stat-card"><div class="stat-value info">' + s.totalLines.toLocaleString() + '</div><div class="stat-label">总日志行数</div></div>' +
    '<div class="stat-card"><div class="stat-value warn">' + s.errorCount.toLocaleString() + '</div><div class="stat-label">错误日志数</div></div>' +
    '<div class="stat-card"><div class="stat-value warn">' + s.noreadCount.toLocaleString() + '</div><div class="stat-label">NOREAD 条数</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + s.noreadEvents + '</div><div class="stat-label">NOREAD 事件数</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + s.deviceFaults + '</div><div class="stat-label">设备故障事件</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + s.deviceCount + '</div><div class="stat-label">涉及设备数</div></div>' +
    '<div class="stat-card"><div class="stat-value" style="font-size:12px">' + timeLabel + '</div><div class="stat-label">时间跨度</div></div>' +
    '<div class="stat-card"><div class="stat-value ok">' + s.healthScore + '%</div><div class="stat-label">正常日志占比</div></div>';
}

function formatDuration(seconds) {
  if (seconds < 60) return seconds + '秒';
  if (seconds < 3600) return Math.floor(seconds/60) + '分' + (seconds%60) + '秒';
  return Math.floor(seconds/3600) + '时' + Math.floor((seconds%3600)/60) + '分';
}

function renderNOREADPanel(data) {
  var events = (data.noreadEvents || []).slice();
  if (currentView === 'weekly') {
    events.sort(function(a,b) { return b.count - a.count; });
  }
  document.getElementById('noreadBadge').textContent = events.length + ' 起';

  if (events.length === 0) {
    document.getElementById('noreadPanel').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#10004;</div><div>无 NOREAD 事件</div></div>';
    return;
  }

  var html = '<table><thead><tr>';
  if (currentView === 'weekly') html += '<th>日期</th>';
  html += '<th>设备</th><th>故障开始</th><th>问题解决</th><th>恢复条码</th><th>持续时长</th><th>扫描失败次数</th></tr></thead><tbody>';

  for (var i = 0; i < events.length; i++) {
    var ev = events[i];
    var startTime = ev.start.substring(11);
    var endTimeLabel = ev.end.substring(11);
    var barcode = '--';
    var recoveryNote = '';

    if (ev.manualBarcode) {
      endTimeLabel = ev.manualBarcode.time.substring(11);
      barcode = ev.manualBarcode.barcode;
      recoveryNote = ' (人工补码)';
    } else if (ev.recovery) {
      endTimeLabel = ev.recovery.time.substring(11);
      barcode = ev.recovery.barcode;
    }

    var duration = Math.round((new Date(ev.end).getTime() - new Date(ev.start).getTime()) / 1000);
    var durStr = formatDuration(duration);
    var badgeClass = ev.count > 1000 ? 'badge-danger' : ev.count > 300 ? 'badge-warn' : 'badge-info';

    html += '<tr>';
    if (currentView === 'weekly') html += '<td>' + formatDateShort(ev.date) + '</td>';
    html +=
      '<td><span class="badge badge-info">' + ev.device + '</span></td>' +
      '<td>' + startTime + '</td>' +
      '<td>' + endTimeLabel + recoveryNote + '</td>' +
      '<td>' + barcode + '</td>' +
      '<td>' + durStr + '</td>' +
      '<td><span class="badge ' + badgeClass + '">' + ev.count + '</span></td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('noreadPanel').innerHTML = html;
}

function renderDeviceFaultPanel(data) {
  var faults = (data.deviceFaults || []).slice();
  if (currentView === 'weekly') {
    faults.sort(function(a,b) { return a.time.localeCompare(b.time); });
  }
  document.getElementById('faultBadge').textContent = faults.length + ' 起';

  if (faults.length === 0) {
    document.getElementById('deviceFaultPanel').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#10004;</div><div>无设备故障事件</div></div>';
    return;
  }

  var html = '<table><thead><tr>';
  if (currentView === 'weekly') html += '<th>日期</th>';
  html += '<th>设备</th><th>故障类型</th><th>故障开始</th><th>问题解决</th></tr></thead><tbody>';

  for (var i = 0; i < faults.length; i++) {
    var fv = faults[i];
    var startTime = fv.time.substring(11);
    var endTime = '--';
    if (fv.recovery) {
      endTime = fv.recovery.substring(11);
      var dur = Math.round((new Date(fv.recovery).getTime() - new Date(fv.time).getTime()) / 1000);
      endTime += ' (' + formatDuration(dur) + ')';
    }

    html += '<tr>';
    if (currentView === 'weekly') html += '<td>' + formatDateShort(fv.date) + '</td>';
    html +=
      '<td><span class="badge badge-warn">' + fv.device + '</span></td>' +
      '<td>' + fv.faultType + '</td>' +
      '<td>' + startTime + '</td>' +
      '<td>' + endTime + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('deviceFaultPanel').innerHTML = html;
}

function renderErrorChart(data) {
  var panel = document.getElementById('chartPanel');
  try {
    var ctx = document.getElementById('errorChart').getContext('2d');
  } catch(e) {
    panel.innerHTML = '<div class="chart-fallback">图表渲染失败</div>';
    return;
  }
  if (typeof Chart === 'undefined') {
    panel.innerHTML = '<div class="chart-fallback">Chart.js 未加载</div>';
    return;
  }
  if (errorChartInst) { errorChartInst.destroy(); errorChartInst = null; }

  var et = data.errorTypes || {};
  var noreadEvents = (data.noreadEvents || []).length;
  var labels = ['NOREAD事件', '设备故障', '数据库异常', '任务写入失败', '托盘异常', 'WMS等待'];
  var values = [
    noreadEvents,
    (data.deviceFaults || []).length,
    data.dbErrorCount || 0,
    (data.taskFails || []).length,
    (data.trayAnomalies || []).length,
    (data.wmsWaits || []).length
  ];

  try {
    errorChartInst = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: ['#e74c3c','#f39c12','#e67e22','#9b59b6','#3498db','#1abc9c'],
          borderColor: '#0d1528',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#7788aa', padding: 12, font: {size:10} } }
        }
      }
    });
  } catch(e) {
    console.error('[Chart] Error:', e);
    panel.innerHTML = '<div class="chart-fallback">图表渲染失败: ' + e.message + '</div>';
  }
}

function renderHourlyChart(data) {
  var panel = document.getElementById('hourlyPanel');
  try {
    var ctx = document.getElementById('hourlyChart').getContext('2d');
  } catch(e) {
    panel.innerHTML = '<div class="chart-fallback">图表渲染失败</div>';
    return;
  }
  if (typeof Chart === 'undefined') {
    panel.innerHTML = '<div class="chart-fallback">Chart.js 未加载</div>';
    return;
  }
  if (hourlyChartInst) { hourlyChartInst.destroy(); hourlyChartInst = null; }

  var labels = [];
  for (var i = 0; i < 24; i++) labels.push(i + '时');
  var h = data.hourly || [];
  var errData = h.map(function(x) { return x.errors || 0; });
  var normData = h.map(function(x) { return x.normal || 0; });

  try {
    hourlyChartInst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: '错误', data: errData, backgroundColor: '#e74c3c', borderRadius: 2 },
          { label: '正常', data: normData, backgroundColor: '#2ecc71', borderRadius: 2 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#7788aa', font: {size:9} }, grid: { color: '#1a2a4a' } },
          y: { ticks: { color: '#7788aa' }, grid: { color: '#1a2a4a' } }
        },
        plugins: { legend: { labels: { color: '#7788aa', font: {size:10} } } }
      }
    });
  } catch(e) {
    console.error('[Chart] Error:', e);
    panel.innerHTML = '<div class="chart-fallback">图表渲染失败: ' + e.message + '</div>';
  }
}

function renderWeeklyBarChart(data) {
  // For weekly view: bar chart by day
  var panel = document.getElementById('hourlyPanel');
  try {
    var ctx = document.getElementById('hourlyChart').getContext('2d');
  } catch(e) {
    panel.innerHTML = '<div class="chart-fallback">图表渲染失败</div>';
    return;
  }
  if (typeof Chart === 'undefined') {
    panel.innerHTML = '<div class="chart-fallback">Chart.js 未加载</div>';
    return;
  }
  if (hourlyChartInst) { hourlyChartInst.destroy(); hourlyChartInst = null; }

  var days = (data.days || []).sort();
  var dayErrors = [];
  var dayNormals = [];

  for (var i = 0; i < days.length; i++) {
    var dd = DATA.daily[days[i]];
    if (dd) {
      dayErrors.push(dd.stats.errorCount);
      dayNormals.push(dd.stats.normalCount);
    } else {
      dayErrors.push(0);
      dayNormals.push(0);
    }
  }

  // Day of week labels (Chinese)
  var dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  var labels = days.map(function(d) {
    var dt = new Date(d.substring(0,4)+'-'+d.substring(4,6)+'-'+d.substring(6,8));
    return formatDateShort(d) + ' ' + dayNames[dt.getDay()];
  });

  try {
    hourlyChartInst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: '错误', data: dayErrors, backgroundColor: '#e74c3c', borderRadius: 2 },
          { label: '正常', data: dayNormals, backgroundColor: '#2ecc71', borderRadius: 2 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#7788aa', font: {size:9} }, grid: { color: '#1a2a4a' } },
          y: { ticks: { color: '#7788aa' }, grid: { color: '#1a2a4a' } }
        },
        plugins: { legend: { labels: { color: '#7788aa', font: {size:10} } } }
      }
    });
  } catch(e) {
    console.error('[Chart] Error:', e);
    panel.innerHTML = '<div class="chart-fallback">图表渲染失败: ' + e.message + '</div>';
  }
}

// ===================== EXPORT PDF =====================
function exportPDF() {
  if (typeof html2canvas === 'undefined') { alert('PDF 导出组件未加载'); return; }
  if (typeof window.jspdf === 'undefined') { alert('PDF 生成组件未加载'); return; }

  showToast('正在生成 PDF...');
  html2canvas(document.body, { backgroundColor: '#0a0f1e', scale: 1.5 }).then(function(canvas) {
    var imgData = canvas.toDataURL('image/png');
    var pdf = new window.jspdf.jsPDF('landscape', 'mm', 'a4');
    var imgWidth = 297;
    var imgHeight = (canvas.height * imgWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
    var label = currentView === 'weekly' ? 'WCS_Weekly_' + currentKey : 'WCS_Daily_' + currentKey;
    pdf.save(label + '.pdf');
    showToast('PDF 报告已导出');
  }).catch(function(e) {
    console.error('[PDF] Error:', e);
    showToast('PDF 导出失败: ' + e.message);
  });
}

// ===================== UTILS =====================
function formatDate(dateStr) {
  if (!dateStr || dateStr.length < 8) return dateStr || '';
  return dateStr.substring(0,4) + '年' + parseInt(dateStr.substring(4,6)) + '月' + parseInt(dateStr.substring(6,8)) + '日';
}

function formatDateShort(dateStr) {
  if (!dateStr || dateStr.length < 8) return dateStr || '';
  return dateStr.substring(4,6) + '/' + dateStr.substring(6,8);
}

function showToast(msg) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

// ===================== START =====================
document.addEventListener('DOMContentLoaded', init);
</script>
